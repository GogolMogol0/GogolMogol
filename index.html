<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⟁ Кагэно-икка | Закрытый портал</title>
    <style>
        body {
            background-color: black;
            color: red;
            font-family: "Courier New", Courier, monospace;
            text-align: center;
            padding: 5%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: background-color 0.5s ease;
        }
        .symbol {
            font-size: 15vw;
            margin-bottom: 5vh;
        }
        .main-text {
            font-size: 5vw;
            margin-bottom: 5vh;
        }
        .warning-text {
            font-size: 3.5vw;
            margin-top: 5vh;
            color: crimson;
        }
        .buttons {
            margin-top: 5vh;
            display: flex;
            gap: 5vw;
            flex-wrap: wrap;
        }
        button {
            padding: 1em 2em;
            font-size: 4vw;
            border: 2px solid red;
            background-color: transparent;
            color: red;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }
        button:hover {
            background-color: red;
            color: black;
        }
        @media (min-width: 768px) {
            .symbol {
                font-size: 120px;
            }
            .main-text {
                font-size: 24px;
            }
            .warning-text {
                font-size: 18px;
            }
            button {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="symbol">⟁</div>
    <div class="main-text">
        Теперь вы <strong>обязуетесь</strong> посетить казино <u>"Кусанаги"</u><br>
        и <strong>не имеете права</strong> разглашать информацию, полученную здесь.
    </div>

    <div class="buttons">
        <button onclick="agree()">Согласен</button>
        <button onclick="disagree()">Не согласен</button>
    </div>

    <div class="warning-text">
        ⚠️ Любая утечка приведёт к тому, что ваши данные исчезнут быстрее, чем ваше сердце успеет забиться второй раз.
    </div>

    <script>
        function agree() {
            alert("Добро пожаловать. Теперь вы под нашей защитой... и наблюдением.");
        }
        function disagree() {
            document.body.style.backgroundColor = "darkred";
            document.body.innerHTML = "<div style=\"color:white; font-size: 5vw; text-align:center; margin-top:20vh;\">Мы вас найдём.</div>";
        }
    </script>
</body>
</html>
