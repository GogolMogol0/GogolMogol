<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Спасибо — Крыска</title>
  <style>
    :root{
      --bg:#0b0b0f;
      --accent:#f6b042;
      --muted:#bfc4c9;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .card{
      max-width:800px;
      width:100%;
      background:rgba(255,255,255,0.02);
      border-radius:16px;
      padding:32px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:20px;
    }
    svg.rat{
      width:180px;
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%{ transform: translateY(0) }
      50%{ transform: translateY(-8px) }
      100%{ transform: translateY(0) }
    }
    .title{font-size:24px;color:var(--accent)}
    .message{font-size:20px}
    .buttons{display:flex;gap:16px;margin-top:12px}
    button{
      padding:10px 16px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-size:16px;
      background:var(--accent);
      color:#000;
      font-weight:600;
      transition:0.3s;
    }
    button:hover{background:#ffca6b}
    /* Полноэкранные состояния */
    .fullscreen{
      position:fixed;
      top:0;left:0;width:100%;height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      z-index:999;
    }
    .blue-screen{
      background:#0044cc;
      color:white;
      font-size:48px;
      text-align:center;
    }
    .cat-screen{
      background:#000;
      color:white;
      text-align:center;
      padding:20px;
    }
    .cat-screen img{
      max-width:300px;
      border-radius:12px;
      margin-bottom:20px;
    }
  </style>
</head>
<body>
  <div class="card" id="main-card">
    <!-- крыска -->
    <svg class="rat" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
      <path d="M35 150c0-40 46-76 96-76s104 36 104 76c0 9-7 16-16 16H51c-9 0-16-7-16-16z" fill="#222" />
      <path d="M65 150c0-28 30-56 70-56s86 28 86 56c0 6-5 10-10 10H75c-5 0-10-4-10-10z" fill="orange" opacity="0.12"/>
      <ellipse cx="68" cy="120" rx="28" ry="22" fill="#2b2b2f"/>
      <circle cx="85" cy="98" r="9" fill="#3c3c42"/>
      <circle cx="83" cy="96" r="5" fill="#ffb56a" opacity="0.12"/>
      <circle cx="56" cy="118" r="4" fill="#fff"/>
      <circle cx="55" cy="118" r="2" fill="#000"/>
      <g stroke="#9da3a8" stroke-width="1.5" stroke-linecap="round">
        <path d="M44 122 q-18 -4 -28 -2" />
        <path d="M44 126 q-18 0 -28 2" />
      </g>
      <path d="M135 160c28 18 38 40 64 52" stroke="#6b6b6f" stroke-width="8" stroke-linecap="round" fill="none"/>
    </svg>

    <div class="title">Спасибо за информацию!</div>
    <div class="message">Еще увидимся!</div>

    <div class="buttons">
      <button onclick="showBlueScreen()">Восстановить данные</button>
      <button onclick="showCat()">Забей</button>
    </div>
  </div>

  <script>
    function showBlueScreen(){
      document.body.innerHTML = `
        <div class="fullscreen blue-screen">
          Ха-ха, поверил!
        </div>
      `;
    }
    function showCat(){
      document.body.innerHTML = `
        <div class="fullscreen cat-screen">
          <img src="https://placekitten.com/400/400" alt="Котик">
          <div style="font-size:32px">Молодец!</div>
        </div>
      `;
    }
  </script>
</body>
</html>
